[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project]
name = "aether_link"
version = "0.1.0"
description = "aether_link project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",

    "langgraph>=0.6.11",
    "langchain-community>=0.3.31",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.35",
    "langchain-anthropic>=0.3.21",
    "langchain-deepseek>=0.1.4",

    "readabilipy>=0.3.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "sse-starlette>=3.0.2",
    "numpy>=2.2.3",
    "yfinance>=0.2.54",
    "json-repair<=0.41.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.43",
    "psycopg[binary,pool]>=3.2.10",
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "bcrypt>=3.2.0,<4.0.0",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=6.4.0",
    "asyncpg>=0.30.0",
    "dashscope>=1.24.2",
    "msgpack>=1.1.0",
    "aiosmtplib>=4.0.0",
    "lxml[html_clean]>=5.3.2",
    "kaleido==0.2.1",
    "plotly>=6.0.1",
    "mistune>=3.1.3",
    "py-spy>=0.3.14",
    "nest-asyncio>=1.6.0",
    "ag-ui-protocol==0.1.9",
    "loguru==0.7.3",
    "ftfy==6.3.1",
    "greenlet==3.2.4",
    "injector==0.22.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/build/
'''
